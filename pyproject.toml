[project]
name = "teleprompter"
version = "0.1.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.150.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=9.1.1",
    "watchfiles>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
